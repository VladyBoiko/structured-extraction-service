# Quick pipeline check without any API or Ollama (fake model).
prompt_version: v1

data:
  texts: data/texts            # one <id>.txt file per ticket
  golden: data/golden          # one <id>.json file with reference labels
  results_dir: results_smoke

request:
  timeout_s: 10
  max_retries: 1
  max_repair_attempts: 1
  max_tokens: 600

runs:
  - name: mock_ok
    provider: mock
    model: mock-perfect
    temperature: null
    top_p: null
    price_input_per_mtok: 0.10
    price_output_per_mtok: 0.50

  - name: mock_flaky
    provider: mock
    model: mock-flaky
    temperature: 0.7
    top_p: 0.9
    price_input_per_mtok: 0.10
    price_output_per_mtok: 0.50
