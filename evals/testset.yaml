# Answer test set: questions with the expected answer and its sources (step 4).
#
# expect           answer | not_found: whether the system should answer or say "I don't know"
# type             answerable (one clear answer) | trap (a competing wrong answer is in the corpus or the context)
#                  | partial (only part of the question is answered by the documents) | unanswerable
# expected_answer  the reference answer, for the judge and for people
# must_include     key facts the answer must contain; each item is one fact, "a | b" = any of the alternatives.
#                  Matching ignores case, spaces inside numbers ("3 000" = "3000") and the decimal sign ("5,90" = "5.90")
# must_not_include values that must not appear (the trap's wrong answer)
# expected_sources documents an answer may cite; at least one citation must come from them
# inject           a chunk added to the retrieved context at rank 1 (an instruction planted in a document)
# known_issue      a failure found before step 4 and what causes it

