# Corpus catalog: every file the RAG ingests and its metadata.
#
#   path            file under data/rag/raw/
#   authoring       store documents: markdown source in data/rag/authoring/, rendered to `path`
#                   (.md copied, .docx and .html generated) by `python -m src.rag build-store`
#   derive          deliberate duplicates for the deduplication check (not real documents)
#   url, sha256     external public documents, fetched by `python -m src.rag download`
#   doc_type        policy | faq | product_page | service | spec_sheet | manual | law
#   region          UA (Ukrainian store) | DACH (German/Austrian/Swiss store) | INTL (all regions)
#                   | EU (EU law) | DE (German law) | GLOBAL (manufacturer documents)
#   status          current | superseded (an older version kept on purpose; retrieval filters it out by default)
#
# Store documents are synthetic: ElectroStore is the fictional shop from block 1 (orders ES-xxxxx).

